name: Generate app icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm install --no-save --no-package-lock sharp

      - name: Rasterize icon PNGs
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const jobs = [
            ['public/icon-source.svg', 'public/icon-192.png', 192],
            ['public/icon-source.svg', 'public/icon-512.png', 512],
            ['public/icon-source.svg', 'public/icon-maskable-512.png', 512],
            ['public/icon-source.svg', 'public/icon-180.png', 180],
            ['public/icon-source.svg', 'public/icon-152.png', 152],
            ['public/favicon.svg', 'public/favicon-32.png', 32],
            ['public/favicon.svg', 'public/favicon-16.png', 16],
          ];
          (async () => {
            for (const [src, out, size] of jobs) {
              await sharp(fs.readFileSync(src), { density: 600 })
                .resize(size, size, { fit: 'contain' })
                .png({ compressionLevel: 9 })
                .toFile(out);
              console.log('wrote', out, size);
            }
          })().catch((e) => {
            console.error(e);
            process.exit(1);
          });
          NODE

      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icon-*.png public/favicon-*.png
          git commit -m "Generate app icon PNGs from SVG masters" || echo "nothing to commit"
          git push
